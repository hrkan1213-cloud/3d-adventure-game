<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Room</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #minimap {
            width: 100%;
            height: 30vh;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #333;
        }

        #minimap-canvas {
            border: 1px solid #444;
        }

        #game-container {
            width: 100%;
            height: 70vh;
            position: relative;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="minimap">
        <canvas id="minimap-canvas"></canvas>
    </div>
    <div id="game-container">
        <div id="info">
            클릭하여 시작<br>
            WASD 또는 방향키: 이동<br>
            마우스: 둘러보기<br>
            ESC: 마우스 해제
        </div>
    </div>
    <script type="module" src="/main.js"></script>
</body>
</html>
