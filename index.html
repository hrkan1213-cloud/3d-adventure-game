<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Room</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #minimap {
            width: 100%;
            height: 30vh;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #333;
        }

        #minimap-canvas {
            border: 1px solid #444;
        }

        #game-container {
            width: 100%;
            height: 70vh;
            position: relative;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
        }

        #health-bar {
            position: absolute;
            top: 80px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 10;
            min-width: 200px;
        }

        .health-label {
            font-size: 12px;
            margin-bottom: 3px;
            font-weight: bold;
        }

        .health-container {
            display: flex;
            gap: 3px;
            margin-bottom: 8px;
        }

        .health-box {
            width: 30px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 3px;
        }

        .health-box.player {
            background-color: #00ff00;
        }

        .health-box.player.empty {
            background-color: #333;
        }

        .health-box.enemy {
            background-color: #ff0000;
        }

        .health-box.enemy.empty {
            background-color: #333;
        }

        #inventory {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            z-index: 10;
            font-size: 14px;
            min-width: 200px;
        }

        #inventory-items {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .inventory-item {
            background: rgba(255, 215, 0, 0.3);
            border: 2px solid #ffd700;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="minimap">
        <canvas id="minimap-canvas"></canvas>
    </div>
    <div id="game-container">
        <div id="info">
            클릭하여 시작<br>
            WASD 또는 방향키: 이동<br>
            마우스: 둘러보기<br>
            스페이스: 공격<br>
            E: 아이템 습득<br>
            ESC: 마우스 해제
        </div>
        <div id="health-bar">
            <div class="health-label">플레이어 체력</div>
            <div class="health-container" id="player-health">
                <div class="health-box player"></div>
                <div class="health-box player"></div>
                <div class="health-box player"></div>
                <div class="health-box player"></div>
                <div class="health-box player"></div>
            </div>
            <div class="health-label">적 남은 수: <span id="enemy-count">2</span></div>
        </div>
        <div id="inventory">
            <div style="font-weight: bold;">아이템창:</div>
            <div id="inventory-items"></div>
        </div>
    </div>
    <script type="module" src="/main.js"></script>
</body>
</html>
