<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Room</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #minimap {
            position: absolute;
            width: 200px;
            height: 200px;
            right: 20px;
            bottom: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #minimap-canvas {
            border: 1px solid #444;
        }

        #game-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
        }

        #help-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid #fff;
            font-size: 24px;
            cursor: pointer;
            z-index: 10;
        }

        #help-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        #help-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 30px 40px;
            border-radius: 15px;
            font-size: 18px;
            z-index: 1000;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            border: 3px solid rgba(255, 255, 255, 0.3);
            min-width: 300px;
            text-align: center;
        }

        #help-panel.hidden {
            display: none;
        }

        #help-panel strong {
            font-size: 24px;
            display: block;
            margin-bottom: 20px;
            color: #ffd700;
        }

        #health-bar {
            position: absolute;
            top: 80px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 10;
            min-width: 200px;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .health-label {
            font-size: 14px;
            margin-bottom: 3px;
            font-weight: bold;
        }

        .health-container {
            display: flex;
            gap: 3px;
            margin-bottom: 8px;
        }

        .health-box {
            width: 30px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 3px;
        }

        .health-box.player {
            background-color: #00ff00;
        }

        .health-box.player.empty {
            background-color: #333;
        }

        .health-box.enemy {
            background-color: #ff0000;
        }

        .health-box.enemy.empty {
            background-color: #333;
        }

        #inventory {
            position: absolute;
            bottom: 10px;
            right: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 10;
            font-size: 16px;
            min-width: 200px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        #inventory-items {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .inventory-item {
            background: rgba(255, 215, 0, 0.3);
            border: 2px solid #ffd700;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
        }

        #weapon-slot {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #555;
        }

        .weapon-equipped {
            background: rgba(0, 100, 255, 0.3);
            border: 2px solid #00aaff;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            display: inline-block;
        }

        #difficulty-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #difficulty-modal.hidden {
            display: none;
        }

        .modal-content {
            background: rgba(20, 20, 20, 0.95);
            padding: 40px;
            border-radius: 15px;
            border: 3px solid #444;
            text-align: center;
            max-width: 500px;
        }

        .modal-title {
            color: #fff;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .difficulty-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .difficulty-btn {
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: 3px solid;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .difficulty-btn.easy {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-color: #2e7d32;
        }

        .difficulty-btn.normal {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            border-color: #E65100;
        }

        .difficulty-btn.hard {
            background: linear-gradient(135deg, #F44336, #D32F2F);
            border-color: #B71C1C;
        }

        .difficulty-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .difficulty-info {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }

        #game-over-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #game-over-modal.hidden {
            display: none;
        }

        .game-over-title {
            color: #ff4444;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
        }

        .game-over-title.victory {
            color: #44ff44;
        }

        .restart-btn {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #2196F3, #1976D2);
            border: 3px solid #0D47A1;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            margin-top: 20px;
        }

        .restart-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.8);
        }

        #hit-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 100px 50px rgba(255, 0, 0, 0);
            transition: box-shadow 0.5s;
            z-index: 500;
        }

        #hit-overlay.hit {
            box-shadow: inset 0 0 100px 50px rgba(255, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="hit-overlay"></div>
    <div id="difficulty-modal">
        <div class="modal-content">
            <div class="modal-title">난이도 선택</div>
            <div class="difficulty-buttons">
                <button class="difficulty-btn easy" onclick="startGame('easy')">
                    쉬움
                    <div class="difficulty-info">적 2마리 (체력 3)</div>
                </button>
                <button class="difficulty-btn normal" onclick="startGame('normal')">
                    보통
                    <div class="difficulty-info">적 3마리 (체력 4)</div>
                </button>
                <button class="difficulty-btn hard" onclick="startGame('hard')">
                    어려움
                    <div class="difficulty-info">적 4마리 (체력 6)</div>
                </button>
            </div>
        </div>
    </div>

    <div id="game-over-modal" class="hidden">
        <div class="modal-content">
            <div class="game-over-title" id="game-over-text">게임 오버!</div>
            <button class="restart-btn" onclick="restartGame()">재시작</button>
        </div>
    </div>
    <div id="minimap">
        <canvas id="minimap-canvas"></canvas>
    </div>
    <div id="game-container">
        <button id="help-btn" onclick="toggleHelp()">?</button>
        <div id="help-panel" class="hidden">
            <strong>조작법</strong>
            <div style="line-height: 2;">
                방향키: 이동<br>
                스페이스: 점프<br>
                A: 공격<br>
                E: 아이템 습득<br>
                1/2/3: 아이템 사용
            </div>
        </div>
        <div id="health-bar">
            <div class="health-label">플레이어 체력</div>
            <div class="health-container" id="player-health">
                <div class="health-box player"></div>
                <div class="health-box player"></div>
                <div class="health-box player"></div>
                <div class="health-box player"></div>
                <div class="health-box player"></div>
            </div>
            <div class="health-label">적 남은 수: <span id="enemy-count">2</span></div>
        </div>
        <div id="inventory">
            <div style="font-weight: bold;">아이템창:</div>
            <div id="inventory-items"></div>
            <div id="weapon-slot">
                <div style="font-weight: bold; margin-bottom: 5px;">무기:</div>
                <div id="weapon-display">없음</div>
            </div>
        </div>
    </div>
    <script>
    function toggleHelp() {
        document.getElementById('help-panel').classList.toggle('hidden');
    }
    </script>
    <script type="module" src="/main.js"></script>
</body>
</html>
